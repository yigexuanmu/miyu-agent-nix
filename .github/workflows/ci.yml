name: CI

# 只做验证，不发布任何东西：本仓库不提供二进制缓存，构建产物留在 runner 里。
# 两个平台都真构建一遍 —— 声明了 aarch64 就必须有 CI 证明它能装能跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package (${{ matrix.system }})
        run: |
          nix build .#default --no-link --print-build-logs
          nix path-info -Sh .#default

      # checks 里包含 package / smoke（跑二进制 + 逐项校验资源 + 真调一次表情库 + onnxruntime 探针）/ format
      - name: Run all checks
        run: nix flake check -L --show-trace

      - name: Show outputs
        run: nix flake show
