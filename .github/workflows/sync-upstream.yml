name: Sync upstream

# 每天巡检上游 SHORiN-KiWATA/miyu-agent 的**最新 Release**（不是 main 的每个提交）：
#   0. 最新 Release 对应的提交 == 当前锁定的 miyu-src -> 什么都不做，不动
#   1. 出了新 Release -> 把 flake.lock 里的 miyu-src 锁到该 tag 指向的提交
#   2. 该 Release 的 PKGBUILD 里默认知识库 wiki 提交变了 -> 同步改写 shorinwiki 引脚
#   3. **先构建、后推送**：构建或冒烟不过就不提交，宁可任务红也不把坏包推给用户
#   4. 推送成功后显式触发 release.yml 部署二进制缓存——必须手动触发，
#      因为 GITHUB_TOKEN 的 push 事件不会级联触发其它 workflow
# 保留 workflow_dispatch 手动入口，可选连带更新 nixpkgs / rust-overlay。
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00（北京 8:00）
  workflow_dispatch:
    inputs:
      update:
        description: '要更新的输入（默认只跟上游 Release）'
        type: choice
        default: miyu-src
        options:
          - miyu-src
          - all

permissions:
  contents: write # 允许 push 到 main
  actions: write  # 允许 gh workflow run 触发 release.yml

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/SHORiN-KiWATA/miyu-agent.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure git author
        run: |
          git config user.name "yigexuanmu"
          git config user.email "yigexuanmu@users.noreply.github.com"

      - name: Detect upstream latest release
        id: check
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/SHORiN-KiWATA/miyu-agent/releases/latest \
            | jq -r .tag_name) || true
          if [ -z "${TAG:-}" ] || [ "$TAG" = "null" ]; then
            echo "::warning::上游还没有任何 Release，本次跳过。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # tag 指向的提交（annotated tag 取 ^{} 剥离后的 commit）
          REL_REV=$(git ls-remote "$UPSTREAM" "refs/tags/${TAG}^{}" | awk '{print $1}')
          [ -n "$REL_REV" ] || REL_REV=$(git ls-remote "$UPSTREAM" "refs/tags/${TAG}" | awk '{print $1}')
          if [ -z "$REL_REV" ]; then
            echo "::error::无法解析 tag ${TAG} 的提交。"; exit 1
          fi

          CURRENT_REV=$(jq -r '.nodes["miyu-src"].locked.rev' flake.lock)
          SHORT=$(git rev-parse --short "$REL_REV" 2>/dev/null || echo "${REL_REV:0:7}")

          {
            echo "tag=$TAG"
            echo "rel_rev=$REL_REV"
            echo "short_rev=$SHORT"
            echo "current_rev=$CURRENT_REV"
          } >> "$GITHUB_OUTPUT"
          echo "Latest release : $TAG ($REL_REV)"
          echo "Locked miyu-src: $CURRENT_REV"

          if [ "$REL_REV" = "$CURRENT_REV" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::最新 Release ${TAG} 已锁定，没有变化，不动。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::有新 Release：$CURRENT_REV -> ${TAG} ($REL_REV)"
          fi

      - name: Detect default-kb wiki pin (of the release)
        id: wiki
        if: steps.check.outputs.changed == 'true'
        run: |
          # 上游把默认知识库的 wiki 提交钉在 miyu-release 的 PKGBUILD 里，
          # 形如 _wiki_commit="${MIYU_RELEASE_WIKI_COMMIT:-<40 位 sha>}"
          REL_REV="${{ steps.check.outputs.rel_rev }}"
          WANT=$(curl -fsSL \
            "https://raw.githubusercontent.com/SHORiN-KiWATA/miyu-agent/${REL_REV}/packaging/arch/miyu-release/PKGBUILD" \
            | sed -n 's/.*MIYU_RELEASE_WIKI_COMMIT:-\([0-9a-f]\{40\}\).*/\1/p' | head -1)
          NOW=$(jq -r '.nodes.shorinwiki.locked.rev // ""' flake.lock)
          echo "Release wiki pin: ${WANT:-<not found>}"
          echo "Local wiki pin  : ${NOW:-<none>}"
          if [ -n "$WANT" ] && [ "$WANT" != "$NOW" ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "rev=$WANT"     >> "$GITHUB_OUTPUT"
            echo "::notice::Shorin Wiki pin moved: $NOW -> $WANT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update other inputs (manual dispatch only)
        if: steps.check.outputs.changed == 'true' && inputs.update == 'all'
        run: nix flake update nixpkgs rust-overlay

      - name: Lock miyu-src to the release
        if: steps.check.outputs.changed == 'true'
        run: |
          REL_REV="${{ steps.check.outputs.rel_rev }}"
          nix flake lock --override-input \
            miyu-src "github:SHORiN-KiWATA/miyu-agent/${REL_REV}"
          # 防御：确认真的锁到了 Release 提交
          GOT=$(jq -r '.nodes["miyu-src"].locked.rev' flake.lock)
          [ "$GOT" = "$REL_REV" ] || { echo "::error::锁定失败：got $GOT"; exit 1; }

      - name: Re-pin shorinwiki in flake.nix
        if: steps.check.outputs.changed == 'true' && steps.wiki.outputs.changed == 'true'
        run: |
          WANT="${{ steps.wiki.outputs.rev }}"
          sed -i -E "s|(Shorin-ArchLinux-Guide/)[0-9a-f]{40}|\1${WANT}|" flake.nix
          grep -q "$WANT" flake.nix || { echo "::error::failed to rewrite the shorinwiki pin in flake.nix"; exit 1; }
          nix flake lock # 只重解析与 flake.nix 不同步的那个 input

      - name: Build before committing
        if: steps.check.outputs.changed == 'true'
        run: |
          nix build .#default --no-link --print-build-logs
          nix build .#checks.x86_64-linux.smoke --no-link --print-build-logs
          nix path-info -Sh .#default

      - name: Commit and push
        id: commit
        if: steps.check.outputs.changed == 'true'
        run: |
          # 防御性：update 后 lock 理论上必有变化，没变说明异常，跳过提交
          if git diff --exit-code -- flake.lock flake.nix; then
            echo "::warning::flake.lock unchanged after update, skip commit."
            exit 0
          fi

          TAG="${{ steps.check.outputs.tag }}"
          SHORT="${{ steps.check.outputs.short_rev }}"
          MSG="sync: 适配上游 ${TAG} (miyu-src -> ${SHORT})"

          BODY=""
          if [ "${{ steps.wiki.outputs.changed }}" = "true" ]; then
            BODY=$(printf '默认知识库 Shorin Wiki 跟随上游钉到 %s\n' "$(echo "${{ steps.wiki.outputs.rev }}" | cut -c1-7)")
          fi
          echo "Commit message: $MSG"

          git add flake.lock flake.nix
          if [ -n "$BODY" ]; then
            git commit -m "$MSG" -m "$BODY"
          else
            git commit -m "$MSG"
          fi
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的 push 不会触发 release.yml，必须显式 workflow_dispatch。
      # workflow_dispatch 是 GITHUB_TOKEN 事件中唯一允许级联触发的类型。
      - name: Trigger binary cache release
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main
          echo "::notice::已触发 release.yml 部署二进制缓存"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### 同步结果（Release 驱动）"
            echo ""
            echo "- 上游最新 Release：\`${{ steps.check.outputs.tag }}\`（\`${{ steps.check.outputs.rel_rev || 'N/A' }}\`）"
            echo "- 旧锁定：\`${{ steps.check.outputs.current_rev || 'N/A' }}\`"
            echo "- 是否有更新：\`${{ steps.check.outputs.changed || 'false' }}\`（没变化就不动）"
            echo "- wiki 引脚变更：\`${{ steps.wiki.outputs.changed || 'false' }}\`"
            echo ""
            echo "构建失败时不会推送，本次任务为红；修好 flake.nix 后手动重跑即可。"
          } >> "$GITHUB_STEP_SUMMARY"
