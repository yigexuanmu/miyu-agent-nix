name: Release

# 构建 miyu 完整闭包，签名后发布为 GitHub Pages 二进制缓存
# （https://yigexuanmu.github.io/miyu-agent-nix/，flake.nix 的 nixConfig
# 已声明），同时打 tar 包附到 Release（tag: latest，滚动更新）作离线备用。
# push 到 main 且 flake 有变化时触发（含 sync-upstream 每日同步）。

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: |
          # 不能加 --no-link：后续冒烟/打包/部署都依赖 ./result 链接
          nix build .#default --print-build-logs
          nix path-info -Sh ./result

      - name: Smoke test
        run: |
          ./result/bin/miyu --version
          ./result/bin/miyu --help >/dev/null

      - name: Pack signed binary cache
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(./result/bin/miyu --version | awk '{print $NF}')"
          echo "MIYU_VERSION=$VERSION" >> "$GITHUB_ENV"

          printenv NIX_SIGNING_KEY > "$RUNNER_TEMP/cache.key"
          mkdir cache
          # 只拷运行时闭包（不含构建依赖），写入时签名
          nix copy --to "file://$PWD/cache" --signing-key "$RUNNER_TEMP/cache.key" ./result
          tar -caf miyu-binary-cache-x86_64-linux.tar.zst cache
          sha256sum miyu-binary-cache-x86_64-linux.tar.zst > SHA256SUMS
          echo "cache size:"; du -sh cache miyu-binary-cache-x86_64-linux.tar.zst

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cache

      - name: Deploy binary cache to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "latest binary cache (miyu ${{ env.MIYU_VERSION }})"
          make_latest: true
          body: |
            Nix 二进制缓存（x86_64-linux），由 CI 构建并用 `miyu-agent-nix-1` 密钥签名。

            本版 miyu：`${{ env.MIYU_VERSION }}`（miyu-src 固定于上游 commit，见 flake.lock）。

            **在线缓存（推荐，flake 自动使用）：** https://yigexuanmu.github.io/miyu-agent-nix/
            安装方式见 README「如何安装」——正常 flake 安装即可，Nix 会自动从缓存拉取，不编译。

            本 Release 附带的 tar 包是同一份缓存的离线快照，仅用于无法直连 Pages 的场景：
            下载解压后把目录加为 `file://` substituter 即可。
          files: |
            miyu-binary-cache-x86_64-linux.tar.zst
            SHA256SUMS
